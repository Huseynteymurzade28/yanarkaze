[package]
name = "yanarkaze-rp-pico2"
description = "yanarkaze on the Raspberry Pi Pico 2 (RP2350, dual Cortex-M33)"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Huseynteymurzade28/yanarkaze"

[dependencies]
# The M33 has native atomics, so the core does not need its critical-section fallback.
yanarkaze-core = { path = "../../core", default-features = false }
cortex-m = { version = "0.7.10", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
# unstable-pac: PWM and pin muxing are set up by register, so any pin can be chosen at runtime.
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-sync = "0.8"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-io-async = "0.7"
heapless = "0.9.4"
panic-halt = "1.0.0"
static_cell = "2.1.1"

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
