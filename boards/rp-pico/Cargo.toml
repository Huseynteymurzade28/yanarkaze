[package]
name = "yanarkaze-rp-pico"
description = "yanarkaze on the Raspberry Pi Pico (RP2040, dual Cortex-M0+)"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Huseynteymurzade28/yanarkaze"

[dependencies]
yanarkaze-core = { path = "../../core" }
cortex-m = { version = "0.7.10", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-io-async = "0.7"
heapless = "0.9.4"
panic-halt = "1.0.0"
static_cell = "2.1.1"

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
