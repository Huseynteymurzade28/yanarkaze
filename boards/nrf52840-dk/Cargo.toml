[package]
name = "yanarkaze-nrf52840-dk"
description = "yanarkaze on the Nordic nRF52840-DK (Cortex-M4F)"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Huseynteymurzade28/yanarkaze"

[dependencies]
yanarkaze-core = { path = "../../core" }
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-nrf = { version = "0.11.0", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
heapless = "0.9.4"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"

[profile.release]
debug = 2
