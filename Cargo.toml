# Host-side workspace: the portable core and the desktop simulator.
#
# The embedded boards are standalone crates (each with its own target, linker setup and
# Cargo.lock), so they are excluded here. Build them from their own directory:
#   cd boards/nucleo-l452re && cargo run --release
[workspace]
resolver = "3"
members = ["core", "boards/sim"]
exclude = ["boards/nucleo-l452re", "boards/rp-pico", "boards/nrf52840-dk", "boards/esp32c3"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Huseynteymurzade28/yanarkaze"
